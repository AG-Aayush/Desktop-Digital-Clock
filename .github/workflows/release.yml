name: Build and publish release

# Tag a version and push it, and this builds the installer and attaches it to
# a GitHub Release:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# The download page links to
# /releases/latest/download/FlipClock-Setup.exe, so the asset filename must
# stay exactly that for the link to keep working.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build the application
        run: python -m PyInstaller --noconfirm FlipClock.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        # Braces are required: the variable's name itself contains "(x86)",
        # and without them PowerShell reads $env:ProgramFiles and appends
        # a literal "(x86)", producing a path that does not exist.
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Check the installer exists
        run: |
          if (-not (Test-Path "dist_installer\FlipClock-Setup.exe")) {
            throw "Installer was not produced"
          }
          Get-Item "dist_installer\FlipClock-Setup.exe" |
            Select-Object Name, Length
        shell: pwsh

      - name: Publish the release
        run: gh release create "$env:GITHUB_REF_NAME" "dist_installer/FlipClock-Setup.exe" --generate-notes --title "FlipClock $env:GITHUB_REF_NAME"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
