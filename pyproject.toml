[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipclock"
version = "1.0.0"
description = "Retro split-flap clock overlay for the Windows desktop"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "AG-Aayush"}]
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.5,<7.0"]

[project.gui-scripts]
flipclock = "desktop_timer:main"

[tool.setuptools]
py-modules = ["desktop_timer"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E,F = pycodestyle errors and pyflakes (real bugs).
# I   = import sorting. B = bugbear, catches subtle mistakes.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: the formatter's job, not worth failing a build over
]

[tool.pytest.ini_options]
testpaths = ["tests"]